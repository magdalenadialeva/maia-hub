# MAIA · Contexto de cada marca para el hub (v27).
# Esto es lo que hace que el Análisis y el Reporte NO sean genéricos.
# Se edita a mano (o se lo pedís a Claude en el proyecto del cliente) y se pushea.
#
# Por marca (slug = el mismo de clients.yaml):
#   contexto : 1–2 líneas. Qué vende, cómo vende, qué sabemos que importa.
#   foco     : qué estamos haciendo este mes con la pauta (sale de la última estrategia aprobada).
#   pedidos  : lo que le pedimos a la marca de forma recurrente (va al Reporte, "Qué necesitamos de vos").
#   arquetipos: los arquetipos de la estrategia (para los filtros del Dashboard).
#   creativos: anuncio -> {arquetipo, angulo, etapa}
#       · etapa = la DECLARADA por estrategia (TOFU/MOFU/BOFU según mensaje y a quién le habla).
#         El hub muestra al lado el ROL que observa en la pauta (atrae / cierra), que no es lo mismo.
#       · la clave es el NOMBRE BASE del anuncio. Las copias/iteraciones ("Ad_6 - Copia 4")
#         heredan solas el tag del original ("Ad_6").
#       · si la clave empieza con "~" es "contiene" (ej. "~Mega Sale" taggea todo lo que diga Mega Sale).
#       · si el nombre del anuncio dice "Angulo X", el hub toma "X" como ángulo aunque no esté acá.
#   Lo que no está taggeado aparece como "sin taggear" (gris), no se inventa.

