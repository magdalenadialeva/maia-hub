# MAIA · Números de la AGENCIA (capítulo "Agencia" del hub).
# Lo que MAIA cobra y gasta por cliente. Moneda: ARS. Editar acá y pushear.
#
# setup_cost           : costo único de seteo de campaña por cliente nuevo.
# acquisition_account  : slug de la cuenta cuya pauta es para CONSEGUIR clientes
#                        (campaña de MAIA / pazfolgueiro). Su gasto = inversión en adquisición.
# targets              : umbrales de los colores (verde si se cumple).
#
# Por cliente:
#   source     : convocatoria (mes gratis) | directo
#   start/end  : inicio / fin con MAIA (end vacío = sigue)
#   free_days  : días del mes gratis (0 si pagó desde el inicio)
#   status     : pagando | gratis | a_confirmar | perdido
#   payments   : lo que nos pagó  [{month, concept: pauta|creativo|otro, amount, cost}]
#                cost = costo directo de ese servicio (p.ej. diseñadora)
#   pending    : cobro esperado si confirma {amount, concept}
#   setup      : false si no se le hizo seteo (default true)

setup_cost: 250000
acquisition_account: paz
targets:
  conversion_free_to_paid: 0.5   # >= 50% de los que terminan el mes gratis pasan a pagar
  retention_paid: 0.8            # >= 80% de los clientes pagos renuevan
  creative_margin: 0.4           # >= 40% de margen en servicio creativo
  payback_months: 3              # recuperar lo invertido por cliente en <= 3 meses

clients:
