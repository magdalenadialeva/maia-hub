# MAIA · Registro de clientes.
# Fuente de verdad de metadatos por marca. El motor cruza esto con los exports.
# `slug` = carpeta dentro de exports/  (exports/<slug>/*.csv)
#
# objective : ventas | leads   -> lógica interna del motor (reporte, señales)
# obj_code  : purchase | ic | lead  -> lo que muestra el hub (OBJLBL). Piera usa
#             "ic" (optimiza a Iniciar pago para validar checkout).
# start_label: texto humano que muestra el hub (DATA.start / INICIO).
# margin    : margen bruto (0-1). Si está, objetivo de ROAS = 1/margin.
# currency  : se autodetecta del export; esto es fallback/override.
# overrides : pisa umbrales de engine.config.Thresholds para este cliente.
#
# El ORDEN de esta lista define el orden en el hub (CLIENTS).

