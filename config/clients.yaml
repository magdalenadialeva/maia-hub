  - slug: saritina-ceramica
    name: "SARITINA CERAMICA"
    objective: ventas
    obj_code: msg          # objetivo real = Tráfico/Mensajes de WhatsApp (no ventas)
    currency: ARS
    ad_account_id: "1583204293185422"
    start_label: "auto"
    margin: 0.5
    # OJO: campaña "Saritina_Trafico_Mensajes_Wsp_Sep" = TRÁFICO / Mensajes de WhatsApp.
    # El resultado real son CONVERSACIONES de WhatsApp, que HOY el export NO trae
    # (la columna "Resultados" viene vacía). Por eso no hay ROAS ni compras: el hub la
    # muestra como objetivo "Mensajes" y la evalúa por señales de arriba (CTR/CPM).
    # Para contar las conversaciones hay que sumar esa métrica de resultado en fetch_meta.
    notes: "Tráfico/Mensajes de WhatsApp (auto-agregada 2026-09-02). Resultado (conversaciones) no disponible en el export todavía."
