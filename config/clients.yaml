# MAIA · Registro de clientes.
# Fuente de verdad de metadatos por marca. El motor cruza esto con la API de Meta.
# `slug` = carpeta dentro de exports/  (exports/<slug>/*.csv)
#
# ad_account_id : ID de la cuenta publicitaria de Meta (solo números, sin "act_").
#             Lo usa engine.fetch_meta para traer la data sola cada mañana.
# objective : ventas | leads   -> lógica interna del motor (reporte, señales)
# obj_code  : purchase | ic | lead  -> lo que muestra el hub (OBJLBL).
# currency  : se autodetecta; esto es fallback/override.
# margin    : margen bruto (0-1). Objetivo de ROAS = 1/margin.
#
# AUTO-DESCUBRIMIENTO: engine.fetch_meta lista todas las cuentas del portfolio y
# SUMA sola cualquier cuenta NUEVA con gasto que no esté acá ni en ignore_account_ids
# (se agrega con nombre de la cuenta y objetivo "ventas"; después se ajusta el nombre).
#
# status    : activa (default) | perdida  -> las "perdida" van al capítulo
#             CUENTAS PERDIDAS al final del General (no cuentan para urgencias
#             ni para el "atrasada"). Se siguen mostrando con su último dato.
# start_maia: fecha (AAAA-MM-DD) en que arrancó la pauta con MAIA -> columna
#             "Inicio pauta" del hub. null = cliente histórico.
# ad_account_ids     : lista, si una marca tiene VARIAS cuentas (se suman en una sola marca).
# campaign_objectives: sólo cuenta campañas con esos objetivos de Meta (p.ej. OUTCOME_SALES
#                      = conversiones). Sirve cuando la cuenta tiene campañas que no hacemos nosotros.
# campaign_exclude   : excluye campañas cuyo nombre contenga ese texto.
# end_maia  : (solo perdidas) fecha de fin con MAIA -> "Fin" y "Con nosotros".
#
# ignore_account_ids: cuentas que NUNCA son clientes (personales, dormidas, la
# propia agencia). Nunca se agregan aunque tengan gasto.

ignore_account_ids:
  - "10150310649593833"   # Maggi Dialeva (personal)
  - "473122206833501"     # Australia & world (AUD)
  - "1669535646753394"    # Sole Pantano
  - "2394340120940661"    # Piera Ceresa Australia (dormida, AUD)
  - "2055620405050036"    # unknown (Read-Only)
  - "1000207433066534"    # Cloe Nutricion Real (cuenta vieja: boosts/tráfico ago-2026, no es pauta MAIA)

# El ORDEN de esta lista define el orden en el hub (CLIENTS).
clients:
  - slug: piera
    status: perdida
    end_maia: "2026-09-04"   # fin de la relación con MAIA
    name: Piera Ceresa
    objective: ventas
    obj_code: ic
    currency: CLP
    ad_account_id: "4114075572016005"
    start_maia: "2026-07-28"
    start_label: "28 jul 2026"
    margin: 0.5
    notes: "Optimiza a Iniciar pago para validar checkout. Freno hoy: página de producto (LPV→ATC)."
    # Fases de optimización (para el color del gráfico y la métrica-resultado).
    # `opt`: purchase | ic | atc | lead  ·  `from`: primer día de esa optimización.
    # Cuando vuelvas a cambiar la optimización, agregá otra fila con su fecha.
    opt_phases:
      - {from: "2026-07-28", opt: purchase, label: "Compra"}
      - {from: "2026-08-18", opt: ic, label: "Iniciar pago (validando checkout)"}

